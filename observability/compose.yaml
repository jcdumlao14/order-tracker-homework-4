name: order-tracker-observability

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: order-tracker-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/collector.yaml"
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/collector.yaml:ro
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18889:8889"
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: order-tracker-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    container_name: order-tracker-loki
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:13100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: order-tracker-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:13200:3200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: order-tracker-grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/order-tracker.json:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
